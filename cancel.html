<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>No Changes Made - Contracting.com</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f4f4;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:14px;padding:44px 36px;max-width:420px;width:100%;text-align:center;box-shadow:0 2px 20px rgba(0,0,0,0.08)}
.icon-wrap{width:72px;height:72px;background:#fff8f0;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:32px}
h1{font-size:21px;font-weight:800;color:#000;margin-bottom:10px;letter-spacing:-0.01em}
.subtitle{font-size:14px;color:#444;line-height:1.65;margin-bottom:6px}
.divider{height:1px;background:#f0f0f0;margin:22px 0}
.contact-note{font-size:12px;color:#888;line-height:1.6;background:#f9f9f9;border-radius:8px;padding:12px 14px;text-align:left}
.contact-note strong{color:#000;display:block;margin-bottom:4px;font-size:12px}
.countdown{margin-top:20px;font-size:12px;color:#bbb}
.countdown span{font-weight:700;color:#888}
</style>
</head>
<body>
<div class="card">
  <div class="icon-wrap">ℹ️</div>
  <h1>No Changes Were Made</h1>
  <p class="subtitle">Your payment method was not updated. Nothing has been changed on your account.</p>
  <div class="divider"></div>
  <div class="contact-note">
    <strong>Need help?</strong>
    If you need to update your card, please contact your coaching team and they will send you a new secure link.
  </div>
  <p class="countdown">This window will close in <span id="count">5</span> seconds...</p>
</div>
<script>
var n = 5;
var el = document.getElementById("count");
var t = setInterval(function() {
  n--;
  el.textContent = n;
  if (n <= 0) {
    clearInterval(t);
    window.close();
  }
}, 1000);
</script>
</body>
</html>
